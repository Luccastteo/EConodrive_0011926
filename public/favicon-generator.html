<!DOCTYPE html>
<html>
<head>
    <title>Gerar Favicon</title>
</head>
<body>
    <canvas id="canvas" width="512" height="512"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // Background
        ctx.fillStyle = '#10b981';
        ctx.beginPath();
        ctx.arc(256, 256, 230, 0, Math.PI * 2);
        ctx.fill();
        
        // Border
        ctx.strokeStyle = '#059669';
        ctx.lineWidth = 20;
        ctx.stroke();
        
        // Gas station icon in white
        ctx.fillStyle = 'white';
        
        // Main structure
        ctx.fillRect(128, 96, 48, 128);
        ctx.fillRect(336, 96, 48, 128);
        
        // Top bar
        ctx.fillRect(128, 64, 256, 32);
        
        // Center display
        ctx.fillRect(192, 128, 128, 96);
        
        // Pump nozzle
        ctx.fillRect(320, 160, 64, 32);
        ctx.fillRect(384, 176, 32, 48);
        
        // Fuel drops
        ctx.beginPath();
        ctx.arc(144, 320, 16, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(368, 320, 16, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(176, 352, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(336, 352, 12, 0, Math.PI * 2);
        ctx.fill();
        
        // Download
        canvas.toBlob(function(blob) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'favicon.png';
            a.click();
        });
    </script>
</body>
</html>
